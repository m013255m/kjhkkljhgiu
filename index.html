<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AirPods Pro | اطلب الآن</title>

    <meta name="description"
          content="احصل على AirPods بتصميم أنيق وصوت مميز. اطلب الآن بسهولة.">

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --black: #080808;
            --dark: #111111;
            --gold: #c8a96b;
            --white: #ffffff;
            --gray: #777;
            --light: #f7f7f7;
            --border: #e9e9e9;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: "Cairo", Arial, sans-serif;
            background: #fff;
            color: #111;
            overflow-x: hidden;
        }

        /* =========================
           HERO
        ========================== */

        .hero {
            min-height: 720px;
            background:
                radial-gradient(circle at 75% 40%,
                rgba(255,255,255,.12),
                transparent 32%),
                linear-gradient(135deg, #050505 0%, #151515 55%, #080808 100%);
            color: white;
            position: relative;
            overflow: hidden;
        }

        .hero::before {
            content: "";
            position: absolute;
            width: 550px;
            height: 550px;
            border-radius: 50%;
            background: rgba(255,255,255,.035);
            top: 80px;
            right: -180px;
            filter: blur(2px);
        }

        .nav {
            width: min(1180px, 92%);
            margin: auto;
            height: 90px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: relative;
            z-index: 2;
        }

        .logo {
            font-size: 22px;
            font-weight: 900;
            letter-spacing: 2px;
        }

        .logo span {
            color: var(--gold);
        }

        .nav-btn {
            border: 1px solid rgba(255,255,255,.25);
            padding: 10px 22px;
            border-radius: 50px;
            color: white;
            text-decoration: none;
            font-size: 13px;
            transition: .3s;
        }

        .nav-btn:hover {
            background: white;
            color: #111;
        }

        .hero-content {
            width: min(1180px, 92%);
            min-height: 610px;
            margin: auto;
            display: grid;
            grid-template-columns: 1fr 1fr;
            align-items: center;
            gap: 60px;
            position: relative;
            z-index: 1;
        }

        .hero-text {
            order: 1;
        }

        .hero-image {
            order: 2;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .eyebrow {
            color: var(--gold);
            font-size: 13px;
            font-weight: 800;
            letter-spacing: 1px;
            margin-bottom: 15px;
        }

        .hero h1 {
            font-size: clamp(38px, 5vw, 68px);
            line-height: 1.15;
            font-weight: 900;
            margin-bottom: 22px;
        }

        .hero h1 span {
            color: var(--gold);
        }

        .hero-description {
            color: #cfcfcf;
            font-size: 17px;
            line-height: 2;
            max-width: 560px;
            margin-bottom: 28px;
        }

        .price-box {
            display: flex;
            align-items: center;
            gap: 18px;
            margin-bottom: 28px;
        }

        .price {
            font-size: 38px;
            font-weight: 900;
        }

        .old-price {
            color: #777;
            text-decoration: line-through;
            font-size: 18px;
        }

        .discount {
            background: var(--gold);
            color: #111;
            padding: 5px 12px;
            border-radius: 30px;
            font-size: 12px;
            font-weight: 900;
        }

        .hero-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 210px;
            padding: 16px 30px;
            background: white;
            color: #111;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 900;
            transition: .3s;
        }

        .hero-btn:hover {
            transform: translateY(-4px);
            box-shadow: 0 15px 35px rgba(255,255,255,.15);
        }

        /* =========================
           PRODUCT IMAGE
        ========================== */

        .product-frame {
            width: min(470px, 90%);
            height: 470px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .product-frame::before {
            content: "";
            position: absolute;
            width: 330px;
            height: 330px;
            border-radius: 50%;
            background: radial-gradient(circle,
                rgba(255,255,255,.17),
                transparent 68%);
        }

        /*
           ضع صورة الإيربودز هنا:
           images/airpods.png
        */

        .product-frame img {
            width: 92%;
            max-height: 430px;
            object-fit: contain;
            position: relative;
            z-index: 2;
            filter: drop-shadow(0 35px 30px rgba(0,0,0,.5));
            transition: .5s;
        }

        .product-frame img:hover {
            transform: scale(1.04) translateY(-8px);
        }

        /* =========================
           TRUST BAR
        ========================== */

        .trust {
            background: white;
            border-bottom: 1px solid var(--border);
            padding: 25px 5%;
        }

        .trust-grid {
            max-width: 1100px;
            margin: auto;
            display: grid;
            grid-template-columns: repeat(4,1fr);
            gap: 20px;
        }

        .trust-item {
            text-align: center;
        }

        .trust-icon {
            font-size: 25px;
            margin-bottom: 5px;
        }

        .trust-item strong {
            display: block;
            font-size: 14px;
        }

        .trust-item small {
            color: var(--gray);
            font-size: 11px;
        }

        /* =========================
           FEATURES
        ========================== */

        .section {
            padding: 95px 5%;
        }

        .section-head {
            text-align: center;
            max-width: 700px;
            margin: 0 auto 50px;
        }

        .section-head small {
            color: var(--gold);
            font-weight: 900;
        }

        .section-head h2 {
            font-size: clamp(30px, 4vw, 45px);
            margin: 10px 0;
        }

        .section-head p {
            color: var(--gray);
            line-height: 1.9;
        }

        .features {
            max-width: 1100px;
            margin: auto;
            display: grid;
            grid-template-columns: repeat(3,1fr);
            gap: 20px;
        }

        .feature {
            border: 1px solid var(--border);
            padding: 32px 25px;
            border-radius: 22px;
            background: #fff;
            transition: .3s;
        }

        .feature:hover {
            transform: translateY(-6px);
            box-shadow: 0 20px 50px rgba(0,0,0,.07);
        }

        .feature-icon {
            width: 50px;
            height: 50px;
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f5f5f5;
            font-size: 22px;
            margin-bottom: 18px;
        }

        .feature h3 {
            margin-bottom: 8px;
            font-size: 18px;
        }

        .feature p {
            color: var(--gray);
            font-size: 14px;
            line-height: 1.9;
        }

        /* =========================
           ORDER
        ========================== */

        .order-section {
            background: #f6f6f6;
            padding: 90px 5%;
        }

        .order-box {
            max-width: 850px;
            margin: auto;
            background:
